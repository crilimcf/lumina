name: Address Radar review round 3 once

on:
  push:
    paths:
      - '.github/workflows/address-radar-review-round3-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/radar-ingestion
      - name: Apply reviewed fetch fix
        env:
          PATCH_B64: >-
            
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/radar_patch.py
          python3 /tmp/radar_patch.py
      - name: Syntax check
        working-directory: api
        run: node --check src/jobs/radar.js
      - name: Commit fix
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/jobs/radar.js api/test/radar-ingestion.test.js
          git commit -m 'fix: reject truncated Radar feed responses'
          git push origin HEAD:feature/radar-ingestion
