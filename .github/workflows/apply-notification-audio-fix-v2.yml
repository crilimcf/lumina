name: Apply notification and call audio fix v2

on:
  push:
    branches: [fix/notifications-badge-call-audio]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notifications-badge-call-audio
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def rep(path, old, new):
              p=Path(path); text=p.read_text(); count=text.count(old)
              if count != 1: raise SystemExit(f'{path}: expected 1, got {count}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          def sub(path, pattern, new):
              p=Path(path); text=p.read_text(); out,count=re.subn(pattern,lambda _m:new,text,count=1,flags=re.S)
              if count != 1: raise SystemExit(f'{path}: regex expected 1: {pattern[:100]!r}')
              p.write_text(out)

          # Web Push: real unread count, explicit zero, and notification IDs in deep links.
          path='api/src/lib/webpush.js'
          rep(path,"""function declarativePayload(notification, badge = 0) {
            const item = notification || {};
            return {
              web_push: 8030,
              ...(badge > 0 ? { app_badge:String(Math.min(999, badge)) } : {}),
              notification: {
                title: String(item.title || 'Lumina').slice(0, 120),
                body: String(item.body || 'Tens uma novidade.').slice(0, 220),
                navigate: absoluteNavigation(item.url),
                silent: false,
                tag: String(item.tag || 'lumina:activity').slice(0, 180),
              },
            };
          }
          ""","""function addNotificationId(value, notificationId) {
            const url = new URL(absoluteNavigation(value));
            if (notificationId) url.searchParams.set('notification', String(notificationId));
            return url.toString();
          }

          export function declarativePayload(notification, badge = 0) {
            const item = notification || {};
            const appBadge = Math.max(0, Math.min(999, Number(badge) || 0));
            return {
              web_push: 8030,
              app_badge: String(appBadge),
              notification: {
                title: String(item.title || 'Lumina').slice(0, 120),
                body: String(item.body || 'Tens uma novidade.').slice(0, 220),
                navigate: absoluteNavigation(item.url),
                silent: false,
                tag: String(item.tag || 'lumina:activity').slice(0, 180),
              },
            };
          }
          """)
          rep(path,"url:`/?tab=dms&call=${encodeURIComponent(item.data?.callId || '')}`","url:addNotificationId(`/?tab=dms&call=${encodeURIComponent(item.data?.callId || '')}`, item.id)")
          rep(path,"url:'/?tab=dms',","url:addNotificationId('/?tab=dms', item.id),")
          sub(path,r"  const latest = options\.notification\s*\n\s*\? \{ notification:options\.notification, badge:options\.badge \|\| 1, callId:options\.callId \|\| null \}\s*\n\s*: await latestNotificationFor\(userId\);\s*\n\s*const pushPayload = latest\.notification \? declarativePayload\(latest\.notification, latest\.badge\) : null;","""  let latest;
            if (options.notification) {
              const countResult = await q(
                'SELECT count(*)::int AS count FROM notifications WHERE user_id=$1 AND read_at IS NULL',
                [userId]
              );
              let notification = options.notification;
              if (options.callId) {
                const { rows: noticeRows } = await q(
                  `SELECT id FROM notifications
                   WHERE user_id=$1 AND type='incoming_call' AND data->>'callId'=$2
                   ORDER BY created_at DESC LIMIT 1`,
                  [userId, String(options.callId)]
                );
                if (noticeRows[0]?.id) notification = { ...notification, url:addNotificationId(notification.url, noticeRows[0].id) };
              }
              latest = { notification, badge:countResult.rows[0]?.count || 0, callId:options.callId || null };
            } else {
              latest = await latestNotificationFor(userId);
            }
            const pushPayload = latest.notification ? declarativePayload(latest.notification, latest.badge) : null;""")

          p=Path('api/src/routes/calls.js'); text=p.read_text(); text=text.replace("    badge:1,\n",'',1); p.write_text(text)

          # Service worker mirrors unread count to Home Screen badge.
          path='web/public/sw.js'
          rep(path,"self.addEventListener('push', (event) => {","""async function syncAppBadge(value) {
            const count = Number(value);
            if (!Number.isFinite(count)) return;
            try {
              if (count > 0 && 'setAppBadge' in self.navigator) await self.navigator.setAppBadge(Math.min(999, Math.floor(count)));
              else if (count <= 0 && 'clearAppBadge' in self.navigator) await self.navigator.clearAppBadge();
            } catch {}
          }

          self.addEventListener('push', (event) => {""")
          sub(path,r"\s{4}let notification = null;\s*\n\s*if \(direct\?\.web_push === 8030 && direct\?\.notification\?\.title\) \{\s*\n\s*notification = \{","""    let notification = null;
            let badgeCount = null;
            if (direct?.web_push === 8030 && direct?.notification?.title) {
              badgeCount = Number(direct.app_badge);
              notification = {""")
          sub(path,r"\s*if \(response\.ok\) notification = \(await response\.json\(\)\)\?\.notification \|\| null;","""      if (response.ok) {
                const payload = await response.json();
                notification = payload?.notification || null;
                badgeCount = Number(payload?.unread);
              }""")
          sub(path,r"\s{4}await self\.registration\.showNotification\(notification\.title \|\| 'Lumina', \{\s*\n\s*body: notification\.body,\s*\n\s*tag: notification\.tag,\s*\n\s*icon: '/icon-192\.png',\s*\n\s*badge: '/icon-192\.png',\s*\n\s*data: \{ url: notification\.url \|\| '/\?tab=alerts' \},\s*\n\s*renotify: true,\s*\n\s*silent: false,\s*\n\s*requireInteraction: notification\.type === 'incoming_call',\s*\n\s*\}\);","""    await Promise.all([
              syncAppBadge(badgeCount),
              self.registration.showNotification(notification.title || 'Lumina', {
                body: notification.body,
                tag: notification.tag,
                icon: '/icon-192.png',
                badge: '/icon-192.png',
                data: { url: notification.url || '/?tab=alerts' },
                renotify: true,
                silent: false,
                requireInteraction: notification.type === 'incoming_call',
              }),
            ]);""")

          # Foreground app keeps icon badge in sync and acknowledges tapped pushes.
          path='web/src/App.jsx'
          rep(path,'export default function App() {',"""const syncAppBadge = async (count) => {
            const value = Math.max(0, Number(count) || 0);
            try {
              if (value > 0 && 'setAppBadge' in navigator) await navigator.setAppBadge(Math.min(999, Math.floor(value)));
              else if (value === 0 && 'clearAppBadge' in navigator) await navigator.clearAppBadge();
            } catch {}
          };

          export default function App() {""")
          rep(path,"""  useEffect(() => {
            if (!me) return;
            refreshUnread();
            const id = setInterval(refreshUnread, 15_000);
            const onVisible = () => { if (document.visibilityState === 'visible') refreshUnread(); };
            document.addEventListener('visibilitychange', onVisible);
            return () => { clearInterval(id); document.removeEventListener('visibilitychange', onVisible); };
          }, [me, refreshUnread]);
          ""","""  useEffect(() => {
            if (!me) return;
            refreshUnread();
            const id = setInterval(refreshUnread, 15_000);
            const onVisible = () => { if (document.visibilityState === 'visible') refreshUnread(); };
            const onNotificationsChanged = () => refreshUnread();
            document.addEventListener('visibilitychange', onVisible);
            window.addEventListener('lumina:notifications-changed', onNotificationsChanged);
            return () => {
              clearInterval(id);
              document.removeEventListener('visibilitychange', onVisible);
              window.removeEventListener('lumina:notifications-changed', onNotificationsChanged);
            };
          }, [me, refreshUnread]);

          useEffect(() => { syncAppBadge(me ? unreadCount : 0); }, [me, unreadCount]);

          useEffect(() => {
            if (!me) return;
            const url = new URL(window.location.href);
            const notificationId = url.searchParams.get('notification');
            if (!notificationId) return;
            let alive = true;
            api.notifications.read(notificationId).catch(() => {}).finally(() => {
              if (!alive) return;
              url.searchParams.delete('notification');
              window.history.replaceState(window.history.state, '', `${url.pathname}${url.search}${url.hash}`);
              refreshUnread();
            });
            return () => { alive = false; };
          }, [me, refreshUnread]);
          """)

          # Message reads notify the global unread counter immediately.
          path='web/src/hooks/useMessages.js'
          rep(path,"import { api } from '../api.js';\n","import { api } from '../api.js';\n\nconst notifyActivityChanged = () => window.dispatchEvent(new CustomEvent('lumina:notifications-changed'));\n")
          rep(path,"""  const loadMessages = useCallback(async () => {
            if (!thread) return [];
            const next = await api.messages.list(thread.id);
            setMsgs(next);
            setThreads(rows => rows.map(row => row.id === thread.id ? { ...row, unread:0 } : row));
            unreadSnapshot.current.set(thread.id, 0);
            return next;
          }, [thread]);
          ""","""  const loadMessages = useCallback(async () => {
            if (!thread) return [];
            const hadUnread = Number(unreadSnapshot.current.get(thread.id) || 0) > 0;
            const next = await api.messages.list(thread.id);
            setMsgs(next);
            setThreads(rows => rows.map(row => row.id === thread.id ? { ...row, unread:0 } : row));
            unreadSnapshot.current.set(thread.id, 0);
            if (hadUnread) notifyActivityChanged();
            return next;
          }, [thread]);
          """)
          rep(path,"""      api.messages.list(thread.id).then(r => {
                if (!current) return;
                setMsgs(r);
                setThreads(rows => rows.map(row => row.id === thread.id ? { ...row, unread:0 } : row));
                unreadSnapshot.current.set(thread.id, 0);
              }).catch(() => {});
          ""","""      const hadUnread = Number(unreadSnapshot.current.get(thread.id) || 0) > 0;
              api.messages.list(thread.id).then(r => {
                if (!current) return;
                setMsgs(r);
                setThreads(rows => rows.map(row => row.id === thread.id ? { ...row, unread:0 } : row));
                unreadSnapshot.current.set(thread.id, 0);
                if (hadUnread) notifyActivityChanged();
              }).catch(() => {});
          """)

          # Audio calls default to WebKit's communication/receiver route.
          path='web/src/hooks/useCalls.js'
          rep(path,'const INCOMING_POLL_MS = 1200;\n',"""const INCOMING_POLL_MS = 1200;

          function setVoiceAudioSession(active) {
            const session = navigator.audioSession;
            if (!session) return;
            try {
              if (active) session.type = 'play-and-record';
              else { session.type = 'playback'; session.type = 'auto'; }
            } catch {}
          }

          const notifyActivityChanged = () => window.dispatchEvent(new CustomEvent('lumina:notifications-changed'));
          """)
          rep(path,"""  const startCall = useCallback(async (thread, mode) => {
            if (!thread || busy) return;
            setBusy(true);
            try {
              const call = await api.calls.start(thread.id, mode);
              setActiveCall({ call, caller:true, person:{ name:thread.name, handle:thread.handle, palette:thread.palette, avatar_url:thread.avatar_url } });
              if (call.callee_push_ready === false) {
                ping('O outro dispositivo não tem notificações de chamada ativas. Se a Lumina estiver fechada, pode não receber o aviso.');
              }
            } catch (e) { ping(e.message); }
            finally { setBusy(false); }
          }, [busy, ping]);
          ""","""  const startCall = useCallback(async (thread, mode) => {
            if (!thread || busy) return;
            const voiceCall = mode === 'audio';
            if (voiceCall) setVoiceAudioSession(true);
            setBusy(true);
            try {
              const call = await api.calls.start(thread.id, mode);
              setActiveCall({ call, caller:true, person:{ name:thread.name, handle:thread.handle, palette:thread.palette, avatar_url:thread.avatar_url } });
              if (call.callee_push_ready === false) {
                ping('O outro dispositivo não tem notificações de chamada ativas. Se a Lumina estiver fechada, pode não receber o aviso.');
              }
            } catch (e) {
              if (voiceCall) setVoiceAudioSession(false);
              ping(e.message);
            } finally { setBusy(false); }
          }, [busy, ping]);
          """)
          rep(path,"""  const acceptIncoming = useCallback(async () => {
            if (!incoming || busy) return;
            setBusy(true);
            try {
              await audioRef.current?.resume?.().catch(() => {});
              const call = await api.calls.answer(incoming.id);
              setActiveCall({ call, caller:false, person:{ name:incoming.name, handle:incoming.handle, palette:incoming.palette, avatar_url:incoming.avatar_url } });
              setIncoming(null);
            } catch (e) { ping(e.message); setIncoming(null); }
            finally { setBusy(false); }
          }, [incoming, busy, ping]);
          ""","""  const acceptIncoming = useCallback(async () => {
            if (!incoming || busy) return;
            const voiceCall = incoming.mode === 'audio';
            if (voiceCall) setVoiceAudioSession(true);
            setBusy(true);
            try {
              await audioRef.current?.resume?.().catch(() => {});
              const call = await api.calls.answer(incoming.id);
              setActiveCall({ call, caller:false, person:{ name:incoming.name, handle:incoming.handle, palette:incoming.palette, avatar_url:incoming.avatar_url } });
              setIncoming(null);
              notifyActivityChanged();
            } catch (e) {
              if (voiceCall) setVoiceAudioSession(false);
              ping(e.message); setIncoming(null);
            } finally { setBusy(false); }
          }, [incoming, busy, ping]);
          """)
          rep(path,"""  const declineIncoming = useCallback(async () => {
            const current = incoming;
            setIncoming(null);
            if (!current) return;
            try { await api.calls.decline(current.id); }
            catch (e) { ping(e.message); }
          }, [incoming, ping]);

          const closeActiveCall = useCallback(() => setActiveCall(null), []);
          ""","""  const declineIncoming = useCallback(async () => {
            const current = incoming;
            setIncoming(null);
            if (!current) return;
            try { await api.calls.decline(current.id); notifyActivityChanged(); }
            catch (e) { ping(e.message); }
          }, [incoming, ping]);

          const closeActiveCall = useCallback(() => {
            setVoiceAudioSession(false);
            setActiveCall(null);
            notifyActivityChanged();
          }, []);
          """)

          # Explicit read state in Activity.
          rep('web/src/screens/Atividade.jsx','<div className="m" style={{ marginTop:4 }}>{relativeTime(n.created_at)}</div>', '<div className="m" style={{ marginTop:4,display:\'flex\',alignItems:\'center\',gap:7 }}>{relativeTime(n.created_at)}<span style={{ fontSize:9.5,fontWeight:900,letterSpacing:\'.05em\',textTransform:\'uppercase\',padding:\'2px 6px\',borderRadius:999,background:n.read_at?\'#EDF5F0\':\'#ECE9FF\',color:n.read_at?\'#47705D\':\'var(--cobalt)\' }}>{n.read_at?\'Lida\':\'Não lida\'}</span></div>')

          # API test for explicit badge clearing.
          p=Path('api/test/webpush-encryption.test.js'); text=p.read_text(); text=text.replace("import { encryptWebPushPayload } from '../src/lib/webpush.js';","import { declarativePayload, encryptWebPushPayload } from '../src/lib/webpush.js';",1); text += """

          test('declarative Web Push envia app_badge zero no nível superior', () => {
            const payload = declarativePayload({ title:'Lumina', body:'Teste', url:'/?tab=alerts' }, 0);
            assert.equal(payload.app_badge, '0');
            assert.equal(payload.notification.app_badge, undefined);
          });
          """; p.write_text(text)

          # Mobile Safari regression for unread -> read -> deep-link read.
          Path('web/e2e/notifications-safari.spec.js').write_text(r"""import { test, expect } from '@playwright/test';

          const PASSWORD='lumina-notify-webkit-1234';
          const registration=(handle,name)=>({handle,email:`${handle}@example.test`,password:PASSWORD,name,birthDate:'1990-01-01',acceptTerms:true});

          test('notificação passa de Não lida para Lida e deep-link limpa unread', async ({page,request}) => {
            const suffix=`${Date.now()}${Math.floor(Math.random()*1000)}`;
            const senderHandle=`notifys${suffix}`.slice(0,22), receiverHandle=`notifyr${suffix}`.slice(0,22);
            const senderResponse=await request.post('/api/auth/register',{data:registration(senderHandle,'Sender Notify')});
            expect(senderResponse.status()).toBe(201); const sender=await senderResponse.json();
            await page.goto('/'); await page.getByRole('button',{name:'Criar conta'}).click();
            await page.getByPlaceholder('Como te chamas').fill('Receiver Notify');
            await page.getByPlaceholder('Nome de utilizador').fill(receiverHandle);
            await page.locator('input[type="date"]').fill('1990-01-01');
            await page.getByPlaceholder('Email').fill(`${receiverHandle}@example.test`);
            await page.getByPlaceholder('Password').fill(PASSWORD); await page.locator('input[type="checkbox"]').check();
            await page.getByRole('button',{name:'Criar conta'}).click(); await expect(page.getByText('Bem-vindo à Lumina')).toBeVisible();
            const receiver=await page.evaluate(async()=>await (await fetch('/api/auth/me',{credentials:'include'})).json());
            const headers={authorization:`Bearer ${sender.token}`,'x-csrf-token':sender.csrf};
            const threadResponse=await request.post('/api/messages/threads',{headers,data:{userId:receiver.id}}); expect(threadResponse.status()).toBe(201); const thread=await threadResponse.json();
            const send=async body=>{const r=await request.post(`/api/messages/threads/${thread.id}/messages`,{headers,data:{kind:'text',mode:'normal',body,palette:0}}); expect(r.status()).toBe(201);};
            const unreadCount=()=>page.evaluate(async()=>((await (await fetch('/api/notifications/unread-count',{credentials:'include',cache:'no-store'})).json()).count));

            await send('primeira notificação'); await page.goto('/?tab=alerts');
            const row=page.getByText('Sender Notify enviou-te uma mensagem'); await expect(row).toBeVisible({timeout:5000}); await expect(page.getByText('Não lida')).toBeVisible();
            await row.click(); await expect.poll(unreadCount).toBe(0);
            await page.goto('/?tab=alerts'); await expect(page.getByText('Lida')).toBeVisible();

            await send('segunda notificação');
            await expect.poll(async()=>page.evaluate(async()=>{const d=await (await fetch('/api/notifications',{credentials:'include',cache:'no-store'})).json(); return d.notifications?.some(n=>!n.read_at&&n.type==='message')||false;}),{timeout:5000}).toBe(true);
            const rows=await page.evaluate(async()=>(await (await fetch('/api/notifications',{credentials:'include',cache:'no-store'})).json()).notifications);
            const unread=rows.find(n=>!n.read_at&&n.type==='message'); expect(unread?.id).toBeTruthy();
            await page.goto(`/?tab=dms&notification=${encodeURIComponent(unread.id)}`); await expect.poll(unreadCount).toBe(0);
          });
          """)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/lib/webpush.js api/src/routes/calls.js api/test/webpush-encryption.test.js web/public/sw.js web/src/App.jsx web/src/hooks/useMessages.js web/src/hooks/useCalls.js web/src/screens/Atividade.jsx web/e2e/notifications-safari.spec.js
          git commit -m "fix: sync notification state and route voice calls to receiver"
          git push origin HEAD:fix/notifications-badge-call-audio
