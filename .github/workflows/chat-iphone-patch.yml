name: Apply chat iPhone patch

on:
  push:
    branches:
      - fix/chat-iphone-reactions
    paths:
      - .github/workflows/chat-iphone-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-iphone-reactions
      - name: Apply chat repair
        run: python3 scripts/chat-iphone-patch.py
      - name: Commit repaired sources
        run: |
          rm -f scripts/chat-iphone-patch.py .github/workflows/chat-iphone-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: repair iPhone chat composer and add message reactions"
          git push origin HEAD:fix/chat-iphone-reactions
