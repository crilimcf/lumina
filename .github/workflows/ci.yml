name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'qa/**'
      - 'refactor/**'
      - 'feature/**'
      - 'fix/**'

jobs:
  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina
          POSTGRES_DB: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lumina:lumina@127.0.0.1:5432/lumina_test
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions-0123456789
      PGSSL: 'false'
      MIN_ACCOUNT_AGE_HOURS: '0'
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
