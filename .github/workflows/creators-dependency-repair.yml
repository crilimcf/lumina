name: Creators dependency repair
on:
  push:
    branches:
      - feature/lumina-creators-foundation
    paths:
      - '.github/workflows/creators-dependency-repair.yml'
      - 'api/package.json'
      - 'api/package-lock.json'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumina
          POSTGRES_PASSWORD: lumina
          POSTGRES_DB: lumina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumina -d lumina_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://lumina:lumina@127.0.0.1:5432/lumina_test
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions-0123456789
      PGSSL: 'false'
      MIN_ACCOUNT_AGE_HOURS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair vulnerable production dependencies
        working-directory: api
        run: |
          npm ci
          npm audit fix
          npm audit --omit=dev --audit-level=high
          npm test
      - name: Commit audited lockfile
        run: |
          if ! git diff --quiet -- api/package-lock.json api/package.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add api/package-lock.json api/package.json
            git commit -m 'fix(api): update audited dependency lockfile'
            git push origin HEAD:feature/lumina-creators-foundation
          fi
