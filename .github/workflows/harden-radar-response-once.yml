name: Harden Radar response once

on:
  push:
    paths:
      - '.github/workflows/harden-radar-response-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/radar-ingestion
      - name: Harden feed response stream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/src/jobs/radar.js')
          text = p.read_text()
          old = "    }, (response) => {\n      const status = response.statusCode || 0;"
          new = "    }, (response) => {\n      response.on('error', reject);\n      const status = response.statusCode || 0;"
          if old not in text:
              raise SystemExit('response callback anchor not found')
          text = text.replace(old, new, 1)
          old = "      response.on('end', () => {\n        resolve({\n          notModified: false,"
          new = "      response.on('end', () => {\n        if (!response.complete) {\n          reject(new Error('Resposta RSS incompleta'));\n          return;\n        }\n        resolve({\n          notModified: false,"
          if old not in text:
              raise SystemExit('response end anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit hardening
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/jobs/radar.js
          git commit -m 'fix: reject interrupted Radar feed responses'
          git push origin HEAD:feature/radar-ingestion
