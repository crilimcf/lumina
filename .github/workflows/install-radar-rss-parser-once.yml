name: Install Radar RSS parser once

on:
  push:
    paths:
      - '.github/workflows/install-radar-rss-parser-once.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/radar-ingestion
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Generate dependency lock
        working-directory: api
        run: npm install fast-xml-parser@5.10.1 --save --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lock files
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/package.json api/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: add Radar RSS parser dependency'
          git push origin HEAD:feature/radar-ingestion
