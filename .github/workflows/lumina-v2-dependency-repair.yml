name: Lumina 2.0 one-time dependency repair

on:
  push:
    branches:
      - feature/lumina-2-experience-20261009
    paths:
      - .github/workflows/lumina-v2-dependency-repair.yml

permissions:
  contents: read

jobs:
  repair:
    name: Refresh vulnerable lockfile dependencies
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json
      - name: Fix production dependency vulnerabilities without major upgrades
        run: |
          set -euo pipefail
          cd web
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          cd ../api
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile-only fixes to the feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/package-lock.json api/package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes required'
            exit 0
          fi
          git commit -m "fix(security): refresh vulnerable transitive dependencies"
          git push origin HEAD:feature/lumina-2-experience-20261009
