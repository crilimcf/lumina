name: Native Mobile Validation

on:
  push:
    branches:
      - feat/mobile-native-apps
    paths:
      - 'mobile/**'
      - 'web/**'
      - 'api/**'
      - '.github/workflows/mobile-native.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'web/**'
      - 'api/**'
      - '.github/workflows/mobile-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

env:
  LUMINA_VERSION: '1.0.0'
  LUMINA_BUILD: '1'

jobs:
  android:
    name: Android API 36 build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Build native web bundle
        working-directory: mobile
        run: npm run build:web
      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
          npm run configure:android
      - name: Build debug APK and release AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace
      - name: Upload Android test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumina-android-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install native dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Build native web bundle
        working-directory: mobile
        run: npm run build:web
      - name: Generate iOS project
        working-directory: mobile
        run: |
          npx cap add ios
          npx cap sync ios
          npm run configure:ios
      - name: Resolve native project and compile without signing
        working-directory: mobile
        run: |
          set -euxo pipefail
          if [ -d ios/App/App.xcworkspace ]; then
            xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          else
            xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          fi
      - name: Package iOS simulator result
        if: success()
        working-directory: mobile
        run: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Release-iphonesimulator/App.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" lumina-ios-simulator.zip
      - name: Upload iOS test artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-ios-simulator
          if-no-files-found: error
          retention-days: 14
          path: mobile/lumina-ios-simulator.zip
