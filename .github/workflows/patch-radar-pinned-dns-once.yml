name: Patch Radar pinned DNS once

on:
  push:
    paths:
      - '.github/workflows/patch-radar-pinned-dns-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/radar-ingestion
      - name: Pin validated address family
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('api/src/jobs/radar.js')
          text = p.read_text()
          old = "      servername: target.url.hostname,\n      lookup: (_hostname, _options, callback) => callback(null, target.address, target.family),"
          new = "      servername: target.url.hostname,\n      family: target.family,\n      autoSelectFamily: false,\n      lookup: (_hostname, options, callback) => {\n        if (options?.all) return callback(null, [{ address: target.address, family: target.family }]);\n        callback(null, target.address, target.family);\n      },"
          if old not in text:
              raise SystemExit('expected Radar request block not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/src/jobs/radar.js
          git commit -m 'fix: pin validated DNS family for Radar feeds'
          git push origin HEAD:feature/radar-ingestion
