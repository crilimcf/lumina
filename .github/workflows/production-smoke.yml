name: Production smoke

# Read-only checks, scheduled and manually triggerable after releases.
# Do not run on push/workflow_run: Railway Wait for CI must not wait on a
# smoke workflow that itself might wait for the new deployment.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  verify:
    name: Public endpoints and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify live API, site and staff-only privacy boundary
        shell: bash
        env:
          API_URL: https://api-production-f9e9.up.railway.app
          WEB_URL: https://lumina-snowy-ten.vercel.app
        run: |
          set -euo pipefail
          api_body="$(mktemp)"
          web_body="$(mktemp)"
          trap 'rm -f "$api_body" "$web_body"' EXIT

          # Public endpoints may briefly be unavailable during routine releases.
          # Never send credentials, mutate data or create test accounts in production.
          success=0
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --location --max-time 12 \
                   "$API_URL/health" -o "$api_body" \
               && grep -Eq '"ok"[[:space:]]*:[[:space:]]*true' "$api_body" \
               && curl --fail --silent --show-error --location --max-time 12 \
                   "$WEB_URL/" -o "$web_body" \
               && grep -Eiq '<html' "$web_body" \
               && grep -Eq 'id="root"' "$web_body"; then
              success=1
              break
            fi
            if (( attempt < 18 )); then sleep 15; fi
          done
          if (( success != 1 )); then
            echo "::error::The published API or frontend failed the public health check."
            exit 1
          fi

          # A production report with private aggregate metrics must never be public.
          code="$(curl --silent --show-error --max-time 12 \
             --output /dev/null --write-out '%{http_code}' \
             "$API_URL/api/reports/product-health")"
          if [[ "$code" != "401" ]]; then
            echo "::error::Staff-only product metrics returned HTTP $code to an anonymous request (expected 401)."
            exit 1
          fi
          echo "Public API and frontend healthy. Staff-only metrics reject anonymous access."
