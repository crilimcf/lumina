name: Railway one-time API deploy

on:
  push:
    paths:
      - '.github/workflows/railway-deploy-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Start Railway browserless authorization
        shell: sh
        run: |
          set -eu
          rm -f /tmp/railway-login.log
          nohup railway login --browserless > /tmp/railway-login.log 2>&1 &
          echo $! > /tmp/railway-login.pid
          i=0
          while [ ! -s /tmp/railway-login.log ] && [ "$i" -lt 20 ]; do
            i=$((i+1))
            sleep 1
          done
          cat /tmp/railway-login.log || true

      - name: Publish temporary Railway authorization instructions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/railway-login.log';
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Railway login output was not created.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 3,
              body: `Railway browserless authorization from run ${context.runId}:\n\n\`\`\`text\n${text}\n\`\`\`\n\nAuthorize this session now. The workflow is polling and will deploy the Lumina API automatically after authorization.`
            });

      - name: Wait for Railway authorization and deploy Lumina API
        shell: sh
        run: |
          set -eu
          authorized=0
          i=0
          while [ "$i" -lt 90 ]; do
            if railway whoami >/tmp/railway-whoami.log 2>&1; then
              authorized=1
              break
            fi
            i=$((i+1))
            sleep 5
          done
          if [ "$authorized" -ne 1 ]; then
            echo 'Railway authorization timed out.'
            cat /tmp/railway-login.log || true
            exit 1
          fi
          cat /tmp/railway-whoami.log || true

          linked=0
          linked_service=''
          for project in Lumina lumina; do
            for service in api lumina-api API backend; do
              echo "Trying project=$project service=$service"
              if railway link --project "$project" --environment production --service "$service" --json; then
                linked=1
                linked_service="$service"
                break 2
              fi
            done
          done

          if [ "$linked" -ne 1 ]; then
            echo 'Could not auto-link Lumina. Available Railway projects:'
            railway list --json || true
            exit 78
          fi

          echo "RAILWAY_LINK_OK service=$linked_service"
          railway status --json || true
          railway up --service "$linked_service" --environment production --ci --message "Deploy Lumina API from GitHub master ${GITHUB_SHA}"
          echo 'RAILWAY_DEPLOY_OK'
