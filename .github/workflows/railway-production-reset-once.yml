name: Lumina one-time production reset

on:
  push:
    branches:
      - ops/production-reset-20260809
    paths:
      - '.github/workflows/railway-production-reset-once.yml'

permissions:
  contents: read
  issues: write

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install application and Railway CLI
        run: |
          npm install -g @railway/cli
          cd api
          npm ci
          railway --version

      - name: Start Railway browserless authorization
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/railway-login.log
          nohup railway login --browserless > /tmp/railway-login.log 2>&1 &
          echo $! > /tmp/railway-login.pid
          for _ in $(seq 1 20); do
            if [ -s /tmp/railway-login.log ]; then break; fi
            sleep 1
          done
          cat /tmp/railway-login.log || true

      - name: Publish temporary Railway authorization instructions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/railway-login.log';
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'Railway login output was not created.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 12,
              body: `Railway browserless authorization for the final Lumina production reset (run ${context.runId}):\n\n\`\`\`text\n${text}\n\`\`\`\n\nAuthorize this session now. The workflow will then run the already-tested guarded reset against production.`,
            });

      - name: Wait for authorization and reset production
        shell: bash
        run: |
          set -euo pipefail
          authorized=0
          for _ in $(seq 1 120); do
            if railway whoami >/tmp/railway-whoami.log 2>&1; then
              authorized=1
              break
            fi
            sleep 5
          done
          if [ "$authorized" -ne 1 ]; then
            echo 'Railway authorization timed out.'
            exit 1
          fi

          cd api
          linked=0
          linked_service=''
          for project in Lumina lumina; do
            for service in api lumina-api API backend; do
              echo "Trying project=$project service=$service"
              if railway link --project "$project" --environment production --service "$service" --json; then
                linked=1
                linked_service="$service"
                break 2
              fi
            done
          done

          if [ "$linked" -ne 1 ]; then
            echo 'Could not auto-link the Lumina production API service.'
            railway list --json || true
            exit 78
          fi

          railway status --json
          railway run --service "$linked_service" --environment production --no-local \
            env LUMINA_RESET_CONFIRM=RESET_LUMINA_PRODUCTION npm run reset:production
          echo 'LUMINA_PRODUCTION_RESET_OK'
