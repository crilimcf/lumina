name: Build Railway web fallback

on:
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - '.github/workflows/railway-web-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: railway-web-fallback-master
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Lumina web
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Publish build inside Railway API service
        run: |
          rm -rf api/public
          mkdir -p api/public
          cp -R web/dist/. api/public/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A api/public
          if git diff --cached --quiet; then
            echo "Railway web fallback is already current."
            exit 0
          fi
          git commit -m "build: refresh Railway web fallback"
          git push origin HEAD:master
