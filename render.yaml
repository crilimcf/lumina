# Render Blueprint · cria tudo de uma vez
#
# No Render: New → Blueprint → aponta ao repositório.
# Ele lê este ficheiro e cria a base de dados, a API e os trabalhos periódicos.
#
# Os trabalhos vivem em serviços próprios, não dentro da API. Num plano que
# adormece por inatividade, um cron dentro do processo simplesmente não corre —
# e a comunidade acordava sem convite sem ninguém dar por isso.

databases:
  - name: lumina-db
    databaseName: lumina
    user: lumina
    plan: free

services:
  # ── API ──
  - type: web
    name: lumina-api
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lumina-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true          # o Render gera um segredo forte
      - key: PGSSL
        value: "true"
      - key: NODE_ENV
        value: production
      - key: RUN_JOBS_IN_PROCESS
        value: "false"               # os trabalhos correm nos serviços abaixo
      - key: APP_URL
        sync: false                  # mete o endereço da Vercel à mão
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

  # ── convites: de hora a hora, para apanhar a meia-noite de qualquer fuso ──
  - type: cron
    name: lumina-convites
    runtime: node
    plan: starter
    rootDir: api
    schedule: "2 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/cron.js invites
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lumina-db, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: lumina-api, type: web, envVarKey: JWT_SECRET }
      - key: PGSSL
        value: "true"

  # ── mensagens efémeras: têm de sair depressa ──
  - type: cron
    name: lumina-limpeza
    runtime: node
    plan: starter
    rootDir: api
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/cron.js purge
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lumina-db, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: lumina-api, type: web, envVarKey: JWT_SECRET }
      - key: PGSSL
        value: "true"

  # ── apagamentos RGPD e tokens velhos: uma vez por dia ──
  - type: cron
    name: lumina-manutencao
    runtime: node
    plan: starter
    rootDir: api
    schedule: "30 3 * * *"
    buildCommand: npm ci
    startCommand: node scripts/cron.js deletions tokens
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: lumina-db, property: connectionString }
      - key: JWT_SECRET
        fromService: { name: lumina-api, type: web, envVarKey: JWT_SECRET }
      - key: PGSSL
        value: "true"
