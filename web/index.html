<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07101E" />
    <meta name="description" content="Feed, Rooms, Moments and conversations in one place for your network." />
    <meta name="lumina-ui-release" content="android-pwa-install-2026-09-06" />
    <meta name="format-detection" content="telephone=no, date=no, email=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumina" />
    <link rel="manifest" id="lumina-manifest" href="/manifest.webmanifest?v=2026-09-06c" />
    <script>
      (() => {
        const locales = { pt:'pt-PT', en:'en-US', fr:'fr-FR', es:'es-ES' };
        const descriptions = {
          pt:'Feed, Salas, Momentos e conversas num só espaço para a tua rede.',
          en:'Feed, Rooms, Moments and conversations in one place for your network.',
          fr:'Fil, Salons, Moments et conversations réunis dans un seul espace pour ton réseau.',
          es:'Feed, Salas, Momentos y conversaciones en un solo espacio para tu red.',
        };
        const candidates = [...(Array.isArray(navigator.languages) ? navigator.languages : []), navigator.language].filter(Boolean);
        const language = candidates.map(value => String(value).toLowerCase().split(/[-_]/)[0]).find(value => locales[value]) || 'en';
        document.documentElement.lang = locales[language];
        document.querySelector('meta[name="description"]')?.setAttribute('content', descriptions[language]);
        window.__luminaDeviceLanguage = language;
        const manifest = document.getElementById('lumina-manifest');
        if (manifest) manifest.href = `/manifest-${language}.webmanifest?v=2026-09-06c`;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/lumina-icon-2026.svg?v=2026-09-06c" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=lumina-lamp-20260906" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png?v=lumina-lamp-20260906" />
    <link rel="stylesheet" href="/src/premium-polish.css" />
    <link rel="stylesheet" href="/src/wow-polish.css" />
    <link rel="stylesheet" href="/src/lumina-one-clarity.css" />
    <style>
      html,body,#root{min-height:100%;background:#07101E}html{background:#07101E}body{margin:0;background:#07101E}
      .lumina-auth{overflow-x:clip!important;overflow-y:visible!important}
    </style>
    <title>Lumina</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://web-broadcast.live-video.net/1.37.0/amazon-ivs-web-broadcast.js" crossorigin="anonymous"></script>
    <script type="module" src="/src/main.jsx"></script>
    <script type="module" src="/src/android-pwa-fix.js"></script>
    <script type="module" src="/src/i18n-dom.js"></script>
    <script type="module" src="/src/chat-photo-viewer.js"></script>
    <script type="module" src="/src/passkey-mount.jsx"></script>
    <script type="module" src="/src/pulso-stories-mount.jsx"></script>
    <script type="module" src="/src/radar-three-scope-bridge.js"></script>
    <script type="module" src="/src/notificationRealtime.js"></script>
    <script type="module" src="/src/mobile-auth-bridge.js"></script>
    <script type="module" src="/src/adaptiveDock.js"></script>
    <script type="module" src="/src/lumina-one-v3.js"></script>
    <script type="module" src="/src/lumina-one-feed-adventure.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope:'/', updateViaCache:'none' }).catch((error) => {
            console.warn('[pwa-install] service worker registration failed', error?.message || error);
          });
        }, { once:true });
      }
    </script>
  </body>
</html>
